<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox AI Agent</title>
<style>
  :root {
    --bg:#16161a; --panel:#1f1f26; --line:#2d2d38; --text:#ececf1; --muted:#9a9aab;
    --accent:#f5c518; --user:#2b3a67; --ok:#3ddc84; --bad:#ff5c5c;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; gap:16px; align-items:center; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; margin-inline-end:auto; }
  header h1 span { color:var(--accent); }
  .conn { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .code { font-family:ui-monospace,Consolas,monospace; font-size:18px; letter-spacing:3px; background:#111; border:1px dashed var(--accent); color:var(--accent); padding:4px 12px; border-radius:8px; cursor:pointer; direction:ltr; }
  #help { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 18px; font-size:13px; color:var(--muted); line-height:1.7; }
  #help.hidden { display:none; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; line-height:1.65; white-space:pre-wrap; word-break:break-word; max-width:88%; }
  .msg.user { background:var(--user); align-self:flex-start; }
  .msg.ai { background:var(--panel); border:1px solid var(--line); align-self:flex-end; }
  .msg.err { background:#3a1f1f; border:1px solid var(--bad); align-self:center; }
  .tool { align-self:flex-end; font-size:12.5px; color:var(--muted); background:#101014; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-family:ui-monospace,Consolas,monospace; direction:ltr; max-width:88%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool.ok::before { content:"✓ "; color:var(--ok); }
  .tool.fail::before { content:"✗ "; color:var(--bad); }
  .tool.run::before { content:"⟳ "; color:var(--accent); }
  pre { background:#0c0c10; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; direction:ltr; text-align:left; margin:8px 0; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  p.inl code { background:#0c0c10; padding:1px 5px; border-radius:4px; }
  form { display:flex; gap:10px; padding:14px 18px; background:var(--panel); border-top:1px solid var(--line); max-width:none; }
  form .wrap { display:flex; gap:10px; width:100%; max-width:900px; margin:0 auto; }
  textarea { flex:1; resize:none; height:54px; background:#111; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  textarea:focus { outline:1px solid var(--accent); }
  button { background:var(--accent); color:#111; border:0; border-radius:10px; padding:0 22px; font-weight:700; cursor:pointer; font-size:15px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  select { background:#111; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; direction:ltr; }
  .link { background:none; color:var(--muted); font-weight:400; text-decoration:underline; padding:0; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🍋 Roblox <span>AI Agent</span></h1>
  <select id="provider" title="نموذج الذكاء الاصطناعي"></select>
  <div class="conn"><span class="dot" id="dot"></span><span id="statusText">Studio غير متصل</span></div>
  <div class="code" id="code" title="اضغط للنسخ">........</div>
  <button class="link" id="toggleHelp">كيف أربط Studio؟</button>
</header>

<div id="help">
  1) ثبّت البلجن في Roblox Studio وافتحه من تبويب Plugins.<br>
  2) الصق الكود الظاهر أعلاه في خانة <b>Code</b> داخل البلجن واضغط <b>Connect</b>.<br>
  3) لما تصير النقطة خضراء، اكتب طلبك هنا وسيتم التنفيذ مباشرة في الماب (والتراجع متاح بـ Ctrl+Z).
</div>

<div id="chat"></div>

<form id="form">
  <div class="wrap">
    <textarea id="input" placeholder="مثال: ابنِ لي ساحة مبارزة بحجم 100×100 مع نظام نقاط للاعبين…"></textarea>
    <button id="send" type="submit">إرسال</button>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send");
let code = localStorage.getItem("rbx_agent_code");
let busy = false;
let lastToolEl = null;

function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// تنسيق بسيط: ```code``` و `inline`
function render(text) {
  const parts = text.split(/```(?:\w+)?\n?([\s\S]*?)```/g);
  let html = "";
  parts.forEach((p, i) => {
    if (i % 2) html += "<pre><code>" + esc(p) + "</code></pre>";
    else html += '<span class="inl">' + esc(p).replace(/`([^`]+)`/g, "<code>$1</code>") + "</span>";
  });
  return html;
}

function add(cls, html) {
  const d = document.createElement("div");
  d.className = cls;
  d.dir = "auto";
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function setBusy(b) {
  busy = b;
  sendBtn.disabled = b;
  sendBtn.textContent = b ? "…" : "إرسال";
}

function toolLabel(name, input) {
  const target = input.path || input.name || input.className || "";
  return name + (target ? "  " + target : "");
}

function handle(ev) {
  switch (ev.type) {
    case "status":
      $("dot").classList.toggle("on", ev.connected);
      $("statusText").textContent = ev.connected ? "Studio متصل" : "Studio غير متصل";
      break;
    case "text":
      add("msg ai", render(ev.text));
      break;
    case "tool":
      lastToolEl = add("tool run", esc(toolLabel(ev.name, ev.input)));
      break;
    case "tool_result":
      if (lastToolEl) {
        lastToolEl.className = "tool " + (ev.ok ? "ok" : "fail");
        if (!ev.ok && ev.error) lastToolEl.textContent += "  — " + ev.error;
      }
      break;
    case "error":
      add("msg err", esc(ev.text));
      break;
    case "done":
      setBusy(false);
      input.focus();
      break;
  }
}

async function loadProviders() {
  const sel = $("provider");
  const d = await (await fetch("/api/providers")).json();
  if (!d.providers.length) {
    sel.innerHTML = "<option>لا يوجد مزوّد</option>";
    add("msg err", "السيرفر ما فيه أي مفتاح API. أضف ANTHROPIC_API_KEY أو GEMINI_API_KEY أو GROQ_API_KEY أو DEEPSEEK_API_KEY في Environment.");
    return;
  }
  sel.innerHTML = d.providers.map((p) => `<option value="${p.id}">${p.label} · ${p.model}</option>`).join("");
  const saved = localStorage.getItem("rbx_agent_provider");
  sel.value = d.providers.some((p) => p.id === saved) ? saved : d.default;
  sel.onchange = () => localStorage.setItem("rbx_agent_provider", sel.value);
}

async function init() {
  await loadProviders();
  const r = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) });
  code = (await r.json()).code;
  localStorage.setItem("rbx_agent_code", code);
  $("code").textContent = code;
  const es = new EventSource("/api/events?code=" + code);
  es.onmessage = (e) => handle(JSON.parse(e.data));
  add("msg ai", "أهلاً! اربط Studio بالكود الظاهر فوق، وبعدين قلّي شو بدك نبني. 🛠️");
}

$("code").onclick = () => { navigator.clipboard.writeText(code); $("code").textContent = "تم النسخ ✓"; setTimeout(() => ($("code").textContent = code), 1200); };
$("toggleHelp").onclick = () => $("help").classList.toggle("hidden");

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  add("msg user", esc(text));
  setBusy(true);
  const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code, message: text, provider: $("provider").value }) });
  if (!r.ok) { add("msg err", "فشل الإرسال: " + (await r.text())); setBusy(false); }
};
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

init();
</script>
</body>
</html>
